[project]
name = "anon"
version = "0.1.0"
description = "Anonymization service for the Kipu Pay support corpus (Frontier Hackathon CDMX 2026, Reto 1)"
authors = [
    { name = "Ulises Tame", email = "ulises.g.tame@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
anon = "anon:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
